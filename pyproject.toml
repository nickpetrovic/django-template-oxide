[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "django-template-oxide"
description = "A Rust implementation of Django's template engine."
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["django>=6.0"]
# Version is read from Cargo.toml by maturin so we have a single source
# of truth. Python users see it via `importlib.metadata.version(...)`.
dynamic = ["version"]
authors = [{ name = "Nick Petrovic" }]
readme = "README.md"
keywords = ["django", "template", "rust", "performance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/nickpetrovic/django-template-oxide"
Issues = "https://github.com/nickpetrovic/django-template-oxide/issues"
Changelog = "https://github.com/nickpetrovic/django-template-oxide/blob/main/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "django_template_oxide._rust"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
# django-rusty-templates isn't on PyPI yet; install from the upstream
# repo (https://github.com/LilyFirefly/django-rusty-templates). It is the
# headline competitor benches/bench.py compares against, so it ships in dev.
dev = [
  "pytest>=7",
  "numpy",
  "jinja2",
  "hypothesis>=6",
  "django-rusty-templates @ git+https://github.com/LilyFirefly/django-rusty-templates.git",
]
docs = [
  "zensical>=0.0.69,<0.1",
]
